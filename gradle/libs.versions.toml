[versions]

minSdk = "30"
targetSdk = "37"
compileSdk = "37"
iosMinDeploymentTarget = "15.0"
versionCode = "1"
versionName = "1.0.0"

version-ksp = "2.3.8"
version-kotlin = "2.4.0"
version-compose = "1.11.1"
version-android-application = "9.2.1"
version-android-library = "9.2.1"
version-androidx-activity-compose = "1.13.0"
version-kotlinx-coroutines = "1.11.0"
version-ktor = "3.5.1"
version-kotlinx-serialization = "1.11.0"
version-koin = "4.2.2"
version-coil = "3.5.0"
version-datastore = "1.2.1"
version-compottie = "2.2.4"
version-android-core-ktx = "1.19.0"
version-androidx-appcompat = "1.7.1"
version-google-material = "1.14.0"
version-androidx-lifecycle = "2.10.0"
version-detekt = "1.23.8"
version-detekt-compose = "0.6.2"
version-ktlint = "1.8.0"
version-napier = "2.7.1"
version-turbine = "1.2.1"

version-navigation = "1.1.1"
version-navigation-adaptive = "1.3.0-beta02"
version-navigation-lifecycle = "2.10.0"
version-navigationevent = "1.1.0"

version-classpath-android = "9.2.1"

version-compose-material3 = "1.10.0-alpha05"
version-compose-material-icons = "1.7.3"

# Additional KMP libraries
version-kotlinx-datetime = "0.8.0"
version-multiplatform-settings = "1.3.0"
version-security-crypto = "1.1.0"
version-kotlinx-io = "0.9.1"
version-window = "1.5.1"
version-kvault = "1.12.0"
version-text-to-speech = "3.0.0"
inspektor = "0.4.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "version-androidx-activity-compose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "version-android-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "version-androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "version-google-material" }

androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "version-androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "version-androidx-lifecycle" }

#Multithreading
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "version-kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "version-kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "version-kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "version-kotlinx-coroutines" }

#Testing
turbine = { module = "app.cash.turbine:turbine", version.ref = "version-turbine" }

#Network
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "version-ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "version-ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "version-ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "version-ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "version-ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "version-ktor" }
ktor-client-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "version-ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "version-ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "version-ktor" }
ktor-client-http-timeout = { module = "io.ktor:ktor-client-http-timeout", version.ref = "version-ktor" }

#Prefs
datastore = { module = "androidx.datastore:datastore", version.ref = "version-datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "version-datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "version-datastore" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "version-datastore" }
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "version-datastore" }

#The same as Lottie
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "version-compottie" }
compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "version-compottie" }
compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "version-compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "version-compottie" }

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "version-kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "version-kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "version-kotlinx-serialization" }

#DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "version-koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "version-koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "version-koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "version-koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "version-koin" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "version-koin" }
koin-navigation = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "version-koin" }

#Images
coil = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "version-coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "version-coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "version-coil" }

#Navigation
jetbrains-navigation-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "version-navigation" }
jetbrains-navigation-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "version-navigation-adaptive" }
jetbrains-navigation-viewmodel-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "version-navigation-lifecycle" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "version-navigationevent" }

#Logging
napier = { module = "io.github.aakira:napier", version.ref = "version-napier" }

#Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "version-compose" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "version-compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "version-compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "version-compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "version-compose-material-icons" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "version-compose" }
compose-ui-util = { module = "org.jetbrains.compose.ui:ui-util", version.ref = "version-compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "version-compose" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "version-compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "version-compose" }
compose-animation-graphics = { module = "org.jetbrains.compose.animation:animation-graphics", version.ref = "version-compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "version-compose" }

#Text To Speech
text-to-speech = { module = "nl.marc-apps:tts", version.ref = "version-text-to-speech" }
text-to-speech-compose = { module = "nl.marc-apps:tts-compose", version.ref = "version-text-to-speech" }

#HTTP inspection (dev/staging only)
inspektor = { module = "com.gyanoba.inspektor:inspektor", version.ref = "inspektor" }

#Additional KMP libraries
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "version-kotlinx-datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "version-kotlinx-io" }

#Secure Storage
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "version-multiplatform-settings" }
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "version-multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "version-multiplatform-settings" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "version-security-crypto" }
kvault = { module = "com.liftric:kvault", version.ref = "version-kvault" }
androidx-window = { module = "androidx.window:window", version.ref = "version-window" }

#Classpath
classpath-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "version-kotlin" }
classpath-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "version-kotlin" }
classpath-android = { module = "com.android.tools.build:gradle", version.ref = "version-classpath-android" }
classpath-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "version-compose" }
classpath-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "version-kotlin" }
classpath-detekt = { module = "io.gitlab.arturbosch.detekt:io.gitlab.arturbosch.detekt.gradle.plugin", version.ref = "version-detekt" }
classpath-detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "version-detekt-compose" }
classpath-detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "version-detekt" }
classpath-ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "version-ktlint" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "version-detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "version-ksp" }
compose = { id = "org.jetbrains.compose", version.ref = "version-compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "version-kotlin" }
kmm = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "version-kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "version-kotlin" }
android-application = { id = "com.android.application", version.ref = "version-android-application" }
android-library = { id = "com.android.library", version.ref = "version-android-library" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "version-android-library" }
cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "version-kotlin" }
internal-ktlint-setup = { id = "com.alva.ktlint-setup" }
internal-detekt-setup = { id = "com.alva.detekt-setup" }
internal-kmp-setup = { id = "com.alva.kmp-setup" }
internal-cmp-setup = { id = "com.alva.cmp-setup" }
internal-git-hooks-setup = { id = "com.alva.git-hooks-setup" }
internal-scaffold-setup = { id = "com.alva.scaffold-setup" }
