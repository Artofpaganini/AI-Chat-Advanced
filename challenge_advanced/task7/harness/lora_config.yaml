# Конфиг LoRA для mlx_lm.lora. Ранг, масштаб и dropout флагами не задаются - только отсюда.
# Запуск: mlx_lm.lora -c harness/lora_config.yaml --train

lora_parameters:
  # История значений на этой задаче, чтобы не ходить по кругу:
  # rank 16 на 260 примерах - accuracy 0.8261, но пик около 300 итераций, дальше деградация.
  # rank 8 на 1019 примерах - accuracy 0.7391, train loss застрял на 0.477: это нехватка
  # ёмкости, а не переобучение. Возвращаем 16, чтобы между прогонами менялся ровно один
  # параметр - объём набора.
  rank: 16
  # scale = alpha / rank. Стандартные 2.0, как во всех прогонах.
  scale: 2.0
  # Было 0.05 при малом наборе. Держим 0.1: набор вырос, но в нём много близких формулировок,
  # и адаптер должен опираться на признак, а не на конкретную фразу.
  dropout: 0.1
