# Конфиг LoRA для mlx_lm.lora. Ранг, масштаб и dropout флагами не задаются - только отсюда.
# Запуск: mlx_lm.lora -c harness/lora_config.yaml --train

lora_parameters:
  # 59 обучающих примеров несут единицы килобайт информации.
  # rank 64 дал бы ёмкость, которую нечем наполнить -> зубрёжка.
  # rank 8 местами не тянет разметку блоков. 16 - середина.
  rank: 16
  # scale = alpha / rank. При alpha 32 получаем 2.0 - стандарт.
  # Формат ответа это сильный сигнал, ослаблять адаптер смысла нет.
  scale: 2.0
  # Единственный дешёвый регуляризатор при таком объёме данных.
  dropout: 0.05
