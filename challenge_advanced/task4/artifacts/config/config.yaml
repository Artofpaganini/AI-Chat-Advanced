name: JarvisChat local assistant
version: 1.0.0
schema: v1

# Числа взяты из замера, см. challenge_advanced/task4/BENCHMARK.md.
# ВАЖНО: провайдер `codebase` и эмбеддер `nomic` отключены намеренно - на этой сборке
# continue-intellij-extension 1.0.67 они роняли node-ядро в цикле
# (node:internal/process/promises:288). Для автокомплита и чата они не нужны.

models:
  # Чат, правки, агент. MoE 30.5B, активных 3.3B - отсюда 66.9 tok/s против 24.8 у плотной 14B.
  - name: Qwen3-Coder 30B
    provider: ollama
    model: qwen3-coder:30b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      # 23k токенов промпта = 85 c обработки, 12k = 32 c, 6.5k = 15 c. 16384 - потолок интерактива.
      contextLength: 16384
      maxTokens: 4096
      temperature: 0.1
      topP: 0.9
      topK: 40

  # Автокомплит. Только BASE-модель: instruct на fill-in-the-middle отвечает разговором, а не кодом.
  - name: Qwen2.5-Coder 1.5B Base
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 128
      temperature: 0.05
      topP: 0.9
      # Без стопа модель переписывает полфайла (900 мс, упор в лимит), плагин такую подсказку выбрасывает.
      # Со стопом на пустой строке: 171 мс и чистая подсказка.
      stop:
        - "\n\n"

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: currentFile
