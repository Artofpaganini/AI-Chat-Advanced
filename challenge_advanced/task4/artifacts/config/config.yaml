name: JarvisChat local assistant
version: 1.0.0
schema: v1

# Каждое число здесь взято из замера, см. challenge_advanced/task4/BENCHMARK.md.

models:
  # Чат, правки и агентный режим.
  # MoE 30.5B, активных 3.3B - отсюда 66.9 tok/s против 24.8 у плотной 14B.
  - name: Qwen3-Coder 30B
    provider: ollama
    model: qwen3-coder:30b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      # 23k токенов промпта = 85 секунд только на его обработку. 12k = 32 c, 6.5k = 15 c.
      # 16384 - потолок, при котором ассистент ещё интерактивный.
      contextLength: 16384
      maxTokens: 4096
      temperature: 0.1
      topP: 0.9
      topK: 40
      keepAlive: 3600

  # Автокомплит. Только BASE-модель: instruct на fill-in-the-middle отвечает разговором, а не кодом.
  # 1.5B против 3B: 200 мс против 400-600 мс.
  - name: Qwen2.5-Coder 1.5B Base
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 128
      temperature: 0.05
      topP: 0.9
      keepAlive: 3600
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      prefixPercentage: 0.5
      onlyMyCode: true

  # Эмбеддер для индексации кодовой базы под провайдер @codebase.
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: currentFile
  - provider: codebase
    params:
      nRetrieve: 20
      nFinal: 6
